<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 · Check in after cooking: did everyone eat it, make it again?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=Yellowtail&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E2B45}a:hover{color:#000000}
button,input{font-family:inherit}
.btn:hover{color:#FFFFFF}
:focus-visible{outline:3px solid #1E2B45;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 24px;border-radius:14px;border:2px solid #1E2B45;background:#C8242B;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none;box-shadow:4px 4px 0 #1E2B45;box-sizing:border-box;cursor:pointer}
.icon{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1E2B45}
.big{flex:1;height:48px;border-radius:999px;border:2px solid #1E2B45;background:#FFFFFF;color:#1E2B45;font-weight:700;font-size:16px;cursor:pointer;box-sizing:border-box}
.chip{height:48px;box-sizing:border-box;padding:0 14px;border-radius:999px;border:2px solid #1E2B45;background:#FFFFFF;color:#1E2B45;font-weight:500;font-size:15px;cursor:pointer}
.on{background:#1E2B45;color:#FBF1DC;font-weight:700}
.lab{font-size:15px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF1DC; font-family: 'DM Sans', sans-serif; color: #1E2B45; padding: 12px 24px 40px; display: flex; flex-direction: column; gap: 20px">
<a href="V2-8-Recipe.dc.html" class="icon" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>

<sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -0.5px">Did you make it?</h1>
<p style="margin: 0; font-size: 16px">Lemony White Bean &amp; Kale Skillet</p>
</div>
<div role="group" aria-label="Did you make it" style="display: flex; gap: 10px">
<sc-for list="{{made}}" as="o" hint-placeholder-count="2">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="big on" aria-pressed="true" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
<sc-if value="{{o.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="big" aria-pressed="false" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
</sc-for>
</div>
<sc-if value="{{madeIt}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">Did everyone eat it?</span>
<div role="group" aria-label="Did everyone eat it" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ratings}}" as="o" hint-placeholder-count="4">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
<sc-if value="{{o.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">Make it again?</span>
<div role="group" aria-label="Make it again" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{times}}" as="o" hint-placeholder-count="4">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
<sc-if value="{{o.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{o.pick}}">{{o.label}}</button></sc-if>
</sc-for>
</div>
</div>
</div>
</sc-if>
<div style="flex: 1"></div>
<button type="button" class="btn" onClick="{{finish}}">Done</button>
</div>
</sc-if>

<sc-if value="{{doneView}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
<div style="flex: 1"></div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 54px; line-height: 0.95; letter-spacing: -1px">{{doneTitle}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.45">{{doneLine}}</p>
<div style="flex: 1"></div>
<a href="V2-7-Week.dc.html" class="btn">Back to this week</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { made: 'Made it', rating: 'Most of us did', time: 'Yes', done: false };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var pickList = function (labels, key) {
      return labels.map(function (l) {
        var on = st[key] === l;
        return { label: l, on: on, notOn: !on, pick: function () { var n = {}; n[key] = l; self.setState(n); } };
      });
    };
    var madeIt = st.made === 'Made it';
    return {
      asking: !st.done,
      doneView: st.done,
      madeIt: madeIt,
      made: pickList(['Made it', 'Not this time'], 'made'),
      ratings: pickList(['Everyone ate it', 'Most of us did', 'Someone ate something else', 'Not a hit'], 'rating'),
      times: pickList(['Yes', 'Maybe', 'No'], 'time'),
      finish: function () { self.setState({ done: true }); },
      doneTitle: madeIt ? 'Nice cooking.' : 'No stress.',
      doneLine: !madeIt ? "Want an easier dinner next time? We'll suggest a shorter one." : (st.rating === 'Everyone ate it' ? "That's 1 of 3 this week. Next up: Turkey & Lentil Bolognese on Tuesday." : "Thanks, that helps. We'll lean toward dinners everyone at your table will eat.")
    };
  }
}
</script>
</body>
</html>
