<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4B · Describe who's at the table and foods they won't eat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=Yellowtail&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E2B45}a:hover{color:#000000}
button,input{font-family:inherit}
.btn:hover{color:#FFFFFF}
:focus-visible{outline:3px solid #1E2B45;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 24px;border-radius:14px;border:2px solid #1E2B45;background:#C8242B;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none;box-shadow:4px 4px 0 #1E2B45;box-sizing:border-box}
.back{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1E2B45}
.bar{flex:1;height:6px;border-radius:3px;background:#1E2B45}
.off{opacity:0.2}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 15px;border-radius:999px;border:2px solid #1E2B45;background:#FFFFFF;color:#1E2B45;font-weight:500;font-size:15px;cursor:pointer;box-sizing:border-box}
.on{background:#1E2B45;color:#FBF1DC;font-weight:700}
.lab{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #FBF1DC; font-family: 'DM Sans', sans-serif; color: #1E2B45; padding: 12px 24px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="V2-4-Servings.dc.html" class="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex: 1; display: flex; gap: 6px"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar off"></span><span class="bar off"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -0.5px">Who's at the table?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45">So your week works for everyone, not just you.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">I'm cooking for</span>
<div role="group" aria-label="Who you cook for" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{who}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
<sc-if value="{{c.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">Anything we should plan around?</span>
<div role="group" aria-label="Household needs" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{needs}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
<sc-if value="{{c.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="wonttouch" style="font-size: 15px; font-weight: 700">Foods someone won't touch</label>
<input id="wonttouch" type="text" placeholder="e.g. mushrooms, tofu, anything spicy" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid #1E2B45; background: #FFFFFF; font-size: 16px; color: #1E2B45; box-sizing: border-box">
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: #A9D8C8; border: 2px solid #1E2B45">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M3 11h18"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 4v3"></path></svg>
<span style="font-size: 14px; line-height: 1.5">Every week includes at least one familiar dinner, like a lean-meat favorite made LDL-friendly. Healthy LDL is about less saturated fat and more fiber, not giving up meat.</span>
</div>
<div style="flex: 1"></div>
<a href="V2-5-Pantry.dc.html" class="btn">Next</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: { Partner: true, Kids: true }, needs: { 'A picky eater': true, 'Someone wants meat most nights': true } };
  }
  renderVals() {
    var self = this;
    var multi = function (labels, key) {
      return labels.map(function (l) {
        var on = !!self.state[key][l];
        return { label: l, on: on, notOn: !on, toggle: function () { var n = Object.assign({}, self.state[key]); n[l] = !n[l]; var u = {}; u[key] = n; self.setState(u); } };
      });
    };
    return {
      who: multi(['Just me', 'Partner', 'Kids', 'Teens', 'Parents'], 'who'),
      needs: multi(['A picky eater', 'Someone wants meat most nights', 'Kids avoid spicy', 'We often eat different dinners'], 'needs')
    };
  }
}
</script>
</body>
</html>
