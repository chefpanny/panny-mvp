<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3 · Choose allergies and diets to avoid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=Yellowtail&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E2B45}a:hover{color:#000000}
button,input{font-family:inherit}
.btn:hover{color:#FFFFFF}
:focus-visible{outline:3px solid #1E2B45;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 24px;border-radius:14px;border:2px solid #1E2B45;background:#C8242B;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none;box-shadow:4px 4px 0 #1E2B45;box-sizing:border-box}
.back{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1E2B45}
.bar{flex:1;height:6px;border-radius:3px;background:#1E2B45}
.off{opacity:0.2}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid #1E2B45;background:#FFFFFF;color:#1E2B45;font-weight:500;font-size:15px;cursor:pointer}
.on{background:#1E2B45;color:#FBF1DC;font-weight:700}
.lab{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FBF1DC; font-family: 'DM Sans', sans-serif; color: #1E2B45; padding: 12px 24px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="V2-2-Goal.dc.html" class="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex: 1; display: flex; gap: 6px"><span class="bar"></span><span class="bar"></span><span class="bar off"></span><span class="bar off"></span><span class="bar off"></span><span class="bar off"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -0.5px">Anything off the table?</h1>
<p style="margin: 0; font-size: 16px">We'll never show you these.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">Allergies</span>
<div role="group" aria-label="Allergies" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{allergies}}" as="c" hint-placeholder-count="9">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
<sc-if value="{{c.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lab">I eat</span>
<div role="group" aria-label="Diet" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{diets}}" as="c" hint-placeholder-count="4">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip on" aria-pressed="true" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
<sc-if value="{{c.notOn}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{c.toggle}}">{{c.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="flex: 1"></div>
<a href="V2-4-Servings.dc.html" class="btn">Next</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { allergies: { 'Tree nuts': true }, diet: 'Everything' };
  }
  renderVals() {
    var self = this;
    var a = this.state.allergies;
    var allergies = ['Peanuts', 'Tree nuts', 'Soy', 'Dairy', 'Eggs', 'Wheat', 'Gluten', 'Fish', 'Shellfish', 'Sesame'].map(function (l) {
      var on = !!a[l];
      return { label: l, on: on, notOn: !on, toggle: function () { var n = Object.assign({}, self.state.allergies); n[l] = !n[l]; self.setState({ allergies: n }); } };
    });
    var diets = ['Everything', 'Vegetarian', 'Vegan', 'Pescatarian'].map(function (l) {
      var on = self.state.diet === l;
      return { label: l, on: on, notOn: !on, toggle: function () { self.setState({ diet: l }); } };
    });
    return { allergies: allergies, diets: diets };
  }
}
</script>
</body>
</html>
